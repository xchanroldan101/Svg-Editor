name: "ci workflow"

on:
  workflow_dispatch: 
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Using 'npm install' prevents the Exit Code 1 error you saw earlier
      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test --if-present
