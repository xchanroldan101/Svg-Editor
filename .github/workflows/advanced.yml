name: Advanced CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable verbose logging'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  version-and-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Auto Increment Patch Version
        run: |
          npm version patch -m "chore: bump version to %s [skip ci]"
          git push origin main --follow-tags

  lint-and-audit:
    needs: version-and-bump
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Code Linting
        run: npm run lint

      - name: Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  test:
    needs: lint-and-audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 24, 26]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm run test:coverage

      - name: Upload Test Coverage Artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: coverage/
          retention-days: 7

  deploy-staging:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://example.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Download Test Coverage for Verification
        uses: actions/download-artifact@v4
        with:
          name: test-coverage-report
          path: coverage/

      - name: Deploy to Cloud Provider
        env:
          API_SECRET_KEY: ${{ secrets.STAGING_API_KEY }}
          DEBUG_FLAG: ${{ github.event.inputs.debug_mode }}
        run: |
          if [ "${DEBUG_FLAG}" = "true" ]; then set -x; fi
          npm run deploy
