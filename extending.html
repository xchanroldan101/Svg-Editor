<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="XML Vector Workspace code editor, free, no signup, import, export SVG files, dark and light grid, view images, errors, you can download this site as a zip.">
    <title>XML Vector Workspace</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
    <div id="sidebar">
        <h3>XML Code Input</h3>
        <p style="margin:0; font-size:13px; color:#94a3b8;">Modify raw XML nodes below:</p>
        
        <textarea id="xmlInput" autocomplete="off" oninput="updateHighlight()" spellcheck="false">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b001a" />
      <stop offset="50%" stop-color="#12002b" />
      <stop offset="100%" stop-color="#1a003c" />
    </linearGradient>

    <!-- Shield Glow Gradient -->
    <radialGradient id="shieldGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#4facfe" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Hull Metallic Gradient -->
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e6ed" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#b3c0ce" />
    </linearGradient>

    <!-- Dark Metal / Panels -->
    <linearGradient id="darkMetaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="50%" stop-color="#34495e" />
      <stop offset="100%" stop-color="#1a252f" />
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff416c" />
      <stop offset="100%" stop-color="#ff4b2b" />
    </linearGradient>

    <!-- Engine Thruster Glow -->
    <radialGradient id="thrusterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff416c"/>
      <stop offset="70%" stop-color="#ff4b2b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff4b2b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Stars & Space Dust Overlay -->
  <g fill="#ffffff">
    <circle cx="150" cy="200" r="1.5" opacity="0.6" />
    <circle cx="680" cy="180" r="2.5" opacity="0.8" />
    <circle cx="280" cy="650" r="1" opacity="0.4" />
    <circle cx="620" cy="550" r="2" opacity="0.5" />
    <circle cx="400" cy="120" r="1.5" opacity="0.7" />
    <circle cx="110" cy="480" r="2" opacity="0.6" />
  </g>

  <!-- Outer Cyber Ring Vector -->
  <circle cx="400" cy="420" r="320" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.25" stroke-dasharray="20 10 5 10" />
  <circle cx="400" cy="420" r="290" fill="none" stroke="url(#neonCyan)" stroke-width="1" opacity="0.15" />

  <!-- Force Shield Base Visualizer -->
  <circle cx="400" cy="400" r="260" fill="url(#shieldGlow)" filter="url(#dropShadow)" />

  <!-- Main Spaceship Assembly -->
  <g filter="url(#dropShadow)">
    
    <!-- Engine Thruster Fire (Back Left & Right) -->
    <ellipse cx="340" cy="560" rx="15" ry="40" fill="url(#thrusterGlow)" filter="url(#neonGlow)" />
    <ellipse cx="460" cy="560" rx="15" ry="40" fill="url(#thrusterGlow)" filter="url(#neonGlow)" />
    <ellipse cx="400" cy="570" rx="20" ry="50" fill="url(#thrusterGlow)" filter="url(#neonGlow)" />

    <!-- Left & Right Wing Structures -->
    <!-- Left Wing -->
    <path d="M 400 380 L 220 500 L 250 540 L 330 520 Z" fill="url(#darkMetaGrad)" />
    <path d="M 330 520 L 220 500 L 200 510 L 250 550 L 330 530 Z" fill="url(#hullGrad)" />
    <!-- Right Wing -->
    <path d="M 400 380 L 580 500 L 550 540 L 470 520 Z" fill="url(#darkMetaGrad)" />
    <path d="M 470 520 L 580 500 L 600 510 L 550 550 L 470 530 Z" fill="url(#hullGrad)" />

    <!-- Wing Weapon Pods / Laser Barrels -->
    <rect x="210" y="470" width="8" height="40" rx="4" fill="url(#darkMetaGrad)" />
    <path d="M 212 470 L 214 430 L 216 430 L 218 470 Z" fill="url(#neonCyan)" filter="url(#neonGlow)" />
    
    <rect x="582" y="470" width="8" height="40" rx="4" fill="url(#darkMetaGrad)" />
    <path d="M 584 470 L 586 430 L 588 430 L 590 470 Z" fill="url(#neonCyan)" filter="url(#neonGlow)" />

    <!-- Wing Trim Neon Lines -->
    <path d="M 255 530 L 330 510" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />
    <path d="M 545 530 L 470 510" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />

    <!-- Main Fuselage / Center Hull Body -->
    <path d="M 400 200 L 460 420 L 450 550 L 350 550 L 340 420 Z" fill="url(#hullGrad)" />

    <!-- Hull Intakes / Mechanical Details -->
    <path d="M 370 350 L 390 350 L 385 420 L 365 420 Z" fill="url(#darkMetaGrad)" />
    <path d="M 430 350 L 410 350 L 415 420 L 435 420 Z" fill="url(#darkMetaGrad)" />

    <!-- Center Canopy / Cockpit (Glass) -->
    <path d="M 400 260 L 430 380 L 400 430 L 370 380 Z" fill="url(#darkMetaGrad)" />
    <path d="M 400 275 L 422 375 L 400 415 L 378 375 Z" fill="url(#neonCyan)" opacity="0.8" />
    <!-- Cockpit Core Highlight -->
    <path d="M 400 290 L 412 370 L 400 395 L 388 370 Z" fill="#ffffff" opacity="0.6" />

    <!-- Dorsal Fin / Central Spine -->
    <path d="M 400 350 L 406 520 L 394 520 Z" fill="url(#hullGrad)" opacity="0.9" />
    <path d="M 400 450 L 404 545 L 396 545 Z" fill="url(#neonOrange)" filter="url(#neonGlow)" />

  </g>
</svg></textarea>
        <div id="errorLog"></div>

        <div class="File-Name">
            <input type="text" id="Filename" value="icon">
            <span>.svg</span>
        </div>
        
        <div class="row">
            <button id="themeBtn" style="background:#64748b; color:white;">Dark Grid</button>
            <button id="exportBtn" style="background:#22c55e; color:white;">Download SVG</button>
    </div>
        <label for="fileInput" class="btn" style="background:#e2e8f0; color:#0f172a;">Import SVG File</label>
        <input type="file" id="fileInput" accept=".svg">
    </div>
    <div id="workspace">
        <div id="canvasContainer">
            <div id="canvasNode"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
