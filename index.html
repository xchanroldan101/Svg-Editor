<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Vector Workspace</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
    <div id="sidebar">
        <h3>XML Code Input</h3>
        <p style="margin:0; font-size:13px; color:#94a3b8;">Modify raw XML nodes below:</p>
        
        <textarea id="xmlInput" autocomplete="off" oninput="updateHighlight()" spellcheck="false">
<?xml version="1.0" encoding="UTF-8"?>
<!-- Sample Icon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>XML Vector Workspace</title>
  <g class="layer">
    <title>Icon</title>
    <path d="M 0,50 C 0,11.5 11.5,0 50,0 C 88.5,0 100,11.5 100,50 C 100,88.5 88.5,100 50,100 C 11.5,100 0,88.5 0,50 Z" fill="white" />
    <text x="50" y="50" dominant-baseline="central" text-anchor="middle" font-size="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">SVG</text>
  </g>
</svg></textarea>

        <div id="errorLog"></div>

        <div class="File-Name">
            <input type="text" id="Filename" value="icon">
            <span>.svg</span>
        </div>
        
        <div class="row">
            <button id="themeBtn" style="background:#64748b; color:white;">Dark Grid</button>
            <button id="exportBtn" style="background:#22c55e; color:white;">Download SVG</button>
    </div>
        <label for="fileInput" class="btn" style="background:#e2e8f0; color:#0f172a;">Import SVG File</label>
        <input type="file" id="fileInput" accept=".svg,.xml">
    </div>
    <br><br><br><br><br><br><br><br><br><br>
    What is XML Vector Workspace? XML Vector Workspace is a free SVG editor. It features no log in
    <div id="workspace">
        <div id="canvasContainer">
            <div id="canvasNode"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
