<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="XML Vector Workspace code editor, free, no signup, import, export SVG files, dark and light grid, view images, errors, you can download this site as a zip.">
    <title>XML Vector Workspace</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
    <div id="sidebar">
        <h3>XML Code Input</h3>
        <p style="margin:0; font-size:13px; color:#94a3b8;">Modify raw XML nodes below:</p>
        
        <textarea id="xmlInput" autocomplete="off" oninput="updateHighlight()" spellcheck="false">
<!-- Sample Icon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>XML Vector Workspace</title>
  <g class="layer">
    <title>Icon</title>
    <rect width="100" height="100" fill="#fff" rx="26" ry="26" />
    <text x="50" y="50" dominant-baseline="central" text-anchor="middle" font-size="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">SVG</text>
  </g>
</svg></textarea>

        <div id="errorLog"></div>

        <div class="File-Name">
            <input type="text" id="Filename" value="icon">
            <span>.svg</span>
        </div>
        
        <div class="row">
            <button id="themeBtn" style="background:#64748b; color:white;">Dark Grid</button>
            <button id="exportBtn" style="background:#22c55e; color:white;">Download SVG</button>
    </div>
        <label for="fileInput" class="btn" style="background:#e2e8f0; color:#0f172a;">Import SVG File</label>
        <input type="file" id="fileInput" accept=".svg">
    </div>
    
    <div id="workspace">
        <div id="canvasContainer">
            <div id="canvasNode"></div>
        </div>
    </div>
    <p style="margin: 0; font-size: 11px; color: #6272a4;">Version: <span id="app-version">1.0.0</span></p>
    
    <script src="script.js"></script>
    <script src="jslibraries/version-bumping.js"></script>
</body>
</html>
